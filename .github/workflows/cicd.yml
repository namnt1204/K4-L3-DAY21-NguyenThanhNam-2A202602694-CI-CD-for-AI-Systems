name: Income Model CI/CD

on:
  push:
    branches: [main]
    paths:
      - 'data/**.dvc'
      - 'src/**.py'
      - 'params.yaml'
      - '.dvc/**'
      - '.github/workflows/**'
  workflow_dispatch:

jobs:

  # ---------------------------------------------------------------------------
  # JOB 1 - UNIT TEST
  # Chay unit tests tren du lieu ao (khong can ket noi cloud storage).
  # ---------------------------------------------------------------------------
  unit-test:
    name: Unit Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run unit tests
        run: pytest tests/ -v


  # ---------------------------------------------------------------------------
  # JOB 2 - TRAIN
  # Xac thuc cloud storage, pull du lieu bang DVC, huan luyen mo hinh, upload artifact.
  # ---------------------------------------------------------------------------
  train:
    name: Train
    needs: unit-test
    runs-on: ubuntu-latest
    outputs:
      f1: ${{ steps.read_report.outputs.f1 }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Authenticate and Configure DVC
        env:
          AWS_KEY: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SEC: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          STORAGE_CRED: ${{ secrets.STORAGE_CREDENTIALS }}
        run: |
          python - <<'PYEOF'
          import os, json, sys
          from pathlib import Path

          aws_key = os.environ.get("AWS_KEY", "").strip()
          aws_sec = os.environ.get("AWS_SEC", "").strip()
          storage_cred = os.environ.get("STORAGE_CRED", "").strip()

          # Ho tro doc tu STORAGE_CREDENTIALS neu luu o dang JSON
          if not aws_key and storage_cred:
              try:
                  data = json.loads(storage_cred)
                  aws_key = data.get("aws_access_key_id", data.get("AWS_ACCESS_KEY_ID", ""))
                  aws_sec = data.get("aws_secret_access_key", data.get("AWS_SECRET_ACCESS_KEY", ""))
              except Exception:
                  pass

          if not aws_key or not aws_sec:
              print("=" * 60)
              print("LỖI: GitHub Actions KHÔNG TÌM THẤY AWS Credentials trong Repository Secrets!")
              print(f"AWS_ACCESS_KEY_ID rỗng: {not bool(aws_key)}")
              print(f"AWS_SECRET_ACCESS_KEY rỗng: {not bool(aws_sec)}")
              print(f"STORAGE_CREDENTIALS rỗng: {not bool(storage_cred)}")
              print("=" * 60)
              print("HƯỚNG DẪN KHẮC PHỤC:")
              print("1. Vào GitHub Repo > Settings > Secrets and variables > Actions")
              print("2. Đảm bảo các secret nằm ở 'Repository secrets' (KHÔNG PHẢI 'Environment secrets')")
              print("3. Đảm bảo tên đúng là: AWS_ACCESS_KEY_ID và AWS_SECRET_ACCESS_KEY")
              print("=" * 60)
              sys.exit(1)

          # Tao file credentials va config cho AWS CLI / boto3 / s3fs
          aws_dir = Path.home() / ".aws"
          aws_dir.mkdir(parents=True, exist_ok=True)
          with open(aws_dir / "credentials", "w") as f:
              f.write(f"[default]\naws_access_key_id = {aws_key}\naws_secret_access_key = {aws_sec}\n")
          with open(aws_dir / "config", "w") as f:
              f.write("[default]\nregion = us-east-2\n")

          # Ghi vao GITHUB_ENV cho cac buoc sau
          with open(os.environ["GITHUB_ENV"], "a") as f:
              f.write(f"AWS_ACCESS_KEY_ID={aws_key}\n")
              f.write(f"AWS_SECRET_ACCESS_KEY={aws_sec}\n")
              f.write("AWS_DEFAULT_REGION=us-east-2\n")
              f.write("AWS_REGION=us-east-2\n")

          print("Da thiet lap credentials va ~/.aws/credentials thanh cong.")
          PYEOF

          dvc remote modify --local labstore access_key_id "$AWS_ACCESS_KEY_ID"
          dvc remote modify --local labstore secret_access_key "$AWS_SECRET_ACCESS_KEY"
          dvc remote modify labstore region us-east-2

      - name: Pull data with DVC
        run: dvc pull -v data/train_batch1.csv.dvc data/holdout.csv.dvc

      - name: Train model
        run: python src/train.py

      - name: Read report
        id: read_report
        run: |
          F1=$(python -c "import json; d=json.load(open('outputs/report.json')); print(d['f1_score'])")
          echo "f1=$F1" >> $GITHUB_OUTPUT

      - name: Upload model to Cloud Storage
        env:
          ARTIFACT_BUCKET: ${{ secrets.ARTIFACT_BUCKET }}
        run: |
          python - <<'PYEOF'
          import os, boto3

          bucket = os.environ.get("ARTIFACT_BUCKET", "income-lab-bucket-nguyen-thanh-nam")
          key = "artifacts/current/model.joblib"
          model_path = "models/model.joblib"

          s3 = boto3.client("s3", region_name="us-east-2")
          s3.upload_file(model_path, bucket, key)
          print(f"Uploaded model to s3://{bucket}/{key} successfully")
          PYEOF

      - name: Save report as artifact
        uses: actions/upload-artifact@v4
        with:
          name: report
          path: outputs/report.json


  # ---------------------------------------------------------------------------
  # JOB 3 - QUALITY GATE
  # Kiem tra nguong chat luong (f1_score >= 0.65).
  # ---------------------------------------------------------------------------
  quality-gate:
    name: Quality Gate
    needs: train
    runs-on: ubuntu-latest
    steps:

      - name: Check quality gate
        run: |
          python - <<'PYEOF'
          f1 = float("${{ needs.train.outputs.f1 }}")
          if f1 < 0.65:
              raise SystemExit(f"FAILED: f1_score {f1:.4f} < 0.65. Huy trien khai.")
          print(f"PASSED: f1_score {f1:.4f} >= 0.65. Dang trien khai model.")
          PYEOF


  # ---------------------------------------------------------------------------
  # JOB 4 - RELEASE
  # Trien khai len VM qua SSH.
  # ---------------------------------------------------------------------------
  release:
    name: Release
    needs: quality-gate
    runs-on: ubuntu-latest
    steps:

      - name: SSH deploy to VM
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            sudo systemctl restart income-api
            sleep 5
            curl -sf http://localhost:8080/healthz && echo "Health check passed." || exit 1
